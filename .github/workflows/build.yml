# Construit l'APK et publie une Release (= mise à jour sur les téléphones).
# Ne tourne QUE sur main : on y arrive en fusionnant develop (pull request).
name: Release APK
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".gitignore"]
  workflow_dispatch:
permissions:
  contents: write   # pour publier les Releases
jobs:
  build:
    runs-on: ubuntu-24.04   # figé : image stable avec le SDK Android préinstallé
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # historique complet + tags, pour les notes de version
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle   # constructions plus rapides
      - name: Clé de signature fixe
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/portailkeo.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/portailkeo.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 absent : APK signé avec une clé temporaire."
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/*.apk "PortailKeo-1.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: PortailKeo-apk
          path: PortailKeo-*.apk
      # Publie une Release (lue par l'app pour les mises à jour), seulement avec la clé fixe.
      # Notes de version : les commits depuis la release précédente (hors fusions, doc et CI).
      - name: Notes de version
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          git log --no-merges --pretty='- %s' ${PREV:+$PREV..}HEAD > all-commits.txt
          grep -viE '^- (README|CI|Merge)|\[skip ci\]' all-commits.txt > kept.txt || true
          {
            echo "## Nouveautés"
            if [ -s kept.txt ]; then head -30 kept.txt; else echo "- Améliorations et corrections"; fi
            if [ -n "$PREV" ]; then echo; echo "Changements depuis $PREV."; fi
          } > notes.md
          cat notes.md
      - name: Publier la release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}
          name: "1.${{ github.run_number }}"
          body_path: notes.md
          files: PortailKeo-1.${{ github.run_number }}.apk
