# Construit l'APK et publie une Release (= mise à jour sur les téléphones).
# Ne tourne QUE sur main : on y arrive en fusionnant develop (pull request).
name: Release APK
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".gitignore"]
  workflow_dispatch:
permissions:
  contents: write   # pour publier les Releases
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Clé de signature fixe
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/portailkeo.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/portailkeo.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 absent : APK signé avec une clé temporaire."
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/*.apk "PortailKeo-1.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PortailKeo-apk
          path: PortailKeo-*.apk
      # Publie une Release (lue par l'app pour les mises à jour), seulement avec la clé fixe.
      - name: Publier la release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "1.${{ github.run_number }}"
          body: ${{ github.event.head_commit.message }}
          files: PortailKeo-1.${{ github.run_number }}.apk
