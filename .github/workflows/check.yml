# Tests + compilation à chaque envoi sur develop et sur chaque pull request vers main.
# Ne publie rien : aucune mise à jour n'est envoyée aux téléphones.
name: Tests
on:
  push:
    branches: [develop, "feature/**"]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tests unitaires + compilation
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Résumé des tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = fail = skip = 0
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0)); skip += int(r.get("skipped", 0))
              fail += int(r.get("failures", 0)) + int(r.get("errors", 0))
          level = "error" if fail else "notice"
          print(f"::{level} title=Tests::{total} tests, {fail} en échec, {skip} ignorés")
          PY
      - name: Rapport des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/testDebugUnitTest/
