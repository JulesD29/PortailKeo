# Tests + compilation à chaque envoi sur develop et sur chaque pull request vers main.
# Ne publie rien : aucune mise à jour n'est envoyée aux téléphones.
name: Tests
on:
  push:
    branches: [develop, "feature/**"]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tests unitaires + compilation
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Rapport des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/testDebugUnitTest/
